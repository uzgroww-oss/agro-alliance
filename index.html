<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <!--
      viewport-fit=cover — notch/safe-area uchun (native ilova).

      `maximum-scale=1.0` OLIB TASHLANDI. U inputga bosganda zoom
      bo'lmasligi uchun qo'yilgan edi, lekin ayni paytda saytni
      KATTALASHTIRISHNI butunlay taqiqlardi — ko'zi xira odam matnni
      kattalashtira olmasdi. Zoom muammosini boshqacha hal qilamiz:
      barcha input larda shrift 16px dan kichik emas (iOS faqat
      shundan kichik bo'lganda avtomatik yaqinlashtiradi).

      ⚠️ BU QATOR RASM `preload` IDAN OLDIN TURISHI SHART — pastdagi
      izohga qarang.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      LCP RASMI — TO'G'RI NUSXASI OLDINDAN YUKLANADI.

      ILGARI shu yerda `href="/hero-bg.webp"` (1536px, 57 KB) turardi,
      sahifadagi `<img>` esa `srcset` bo'yicha telefonda kichikroq
      nusxani tanlardi. Ya'ni brauzer IKKITA rasm yuklardi: oldindan
      yuklangan 1536px hech qayerda ishlatilmasdi.

      `imagesrcset` va `imagesizes` — `<img>` dagi bilan AYNAN bir xil
      bo'lishi shart, aks holda brauzer boshqa nusxani tanlaydi va
      oldindan yuklash yana bekorga ketadi.

      ⚠️ TARTIB MUHIM: bu qator `<meta name="viewport">` DAN KEYIN
      turishi shart. Brauzer `100vw` ni shu yerda darhol hisoblaydi,
      viewport sozlamasi esa hali o'qilmagan bo'lsa ekran kengligini
      standart 980px deb oladi. O'lchandi (Moto G Power, 412px):
      preload viewport dan OLDIN turganda 980 x 1.75 = 1715px chiqib,
      brauzer 1536px lik nusxani tortardi — 56 KB bekorga, ustiga
      to'g'ri nusxa alohida yuklanardi.
    -->
    <link
      rel="preload"
      as="image"
      href="/hero-bg-768.webp"
      imagesrcset="/hero-bg-768.webp 768w, /hero-bg-1280.webp 1280w, /hero-bg.webp 1536w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <meta name="description" content="AGRO ALLIANCE — agro blogerlar, fermerlar, kompaniyalar va texnologiyalarni birlashtiruvchi innovatsion media platforma." />
    <!--
      Supabase'ga ULANISHNI OLDINDAN boshlaymiz.
      Sayt ma'lumotining hammasi shu domendan keladi, lekin brauzer u haqda
      faqat JS yuklanib bo'lgach biladi. Foydalanuvchilar O'zbekistonda,
      Supabase loyihasi esa SINGAPURDA (ap-southeast-1) — DNS + TLS qo'l
      siqishi 300ms dan oshadi. (Ilgari bu izohda "Frankfurtda" deb
      yozilgan edi — noto'g'ri.)
      Preconnect uni HTML o'qilayotgan paytda, ya'ni bekorga ketayotgan
      vaqtda boshlab qo'yadi.
    -->
    <link rel="preconnect" href="https://ckdgprxppmtsgrofvkxd.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ckdgprxppmtsgrofvkxd.supabase.co" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Shrift RENDERNI BLOKLAMASIN.
      Oddiy <link rel="stylesheet"> brauzerni to'xtatadi: Google'ning ikkita
      domeniga ulanib, CSS ni yuklab bo'lmaguncha sahifa CHIZILMAYDI.
      media="print" bilan u past ustuvorlikda, bloklamasdan yuklanadi;
      yuklangach media="all" ga o'tkaziladi.
      Matn shu orada tizim shriftida ko'rinadi (display=swap allaqachon shuni qiladi).

      ⚠️ ILGARI shu yerda `onload="this.media='all'"` turardi. U CSP
      bilan sig'ishmaydi: inline hodisa ishlovchisini `script-src` faqat
      'unsafe-inline' bilan o'tkazadi, u esa CSP ning butun ma'nosini
      yo'qotadi. Endi almashtirish pastdagi inline skriptda — u
      sha256 hash bilan ro'yxatga olingan.
    -->
    <link
      id="aa-font"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      media="print"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>
    <title>AGRO ALLIANCE — Agro Media Platforma</title>
    <!--
      BOSH SAHIFA MA'LUMOTI REACT'DAN OLDIN SO'RALADI.

      MUAMMO EDI (PageSpeed, telefon): so'rov faqat React ishga tushib,
      komponent chizilgandan KEYIN ketardi — sekin 4G da bu ~2.5 soniya.
      Shu vaqtgacha ekranda skelet turardi, ma'lumot kelgach esa hero
      bo'limi 259 piksel cho'zilib, pastdagi hamma narsa siljib
      ketardi. Maket siljishi (CLS) 0.356 — bahodan chorak qismi shu
      sabab yo'qolardi.

      Endi so'rov HTML o'qilayotgan payt, ya'ni JavaScript hali
      yuklanmasdan boshlanadi. Borib kelish (~1 s) React
      ishga tushayotgan paytga to'g'ri keladi, natijada birinchi
      chizishdayoq HAQIQIY matn chiqadi: skelet ham, siljish ham yo'q.

      `api.ts` shu va'dani AYNAN shu manzil bo'yicha topib oladi
      (`window.__aaBoot`), shuning uchun manzil ikki joyda bir xil
      qurilishi kerak — til qo'shimchasi ham.

      Faqat bosh sahifada: boshqa sahifalarga bu ma'lumot kerak emas.
      Xato bo'lsa hech narsa buzilmaydi — `api.ts` odatdagidek
      so'rovni o'zi yuboradi.
    -->
    <script>
      /*
        Shriftni ishga tushirish (yuqoridagi <link id="aa-font"> uchun).
        Alohida IIFE — pastdagi blok bosh sahifadan boshqa yerda darhol
        `return` qiladi, shrift esa HAMMA sahifada kerak.
        `f.sheet` tekshiruvi: kesh'dan kelgan uslub biz tinglashni
        boshlagunimizcha yuklanib bo'lgan bo'lishi mumkin — u holda
        `load` hodisasi endi otilmaydi.
      */
      (function () {
        var f = document.getElementById("aa-font")
        if (!f) return
        if (f.sheet) { f.media = "all"; return }
        f.addEventListener("load", function () { f.media = "all" })
      })();

      /* ⚠️ Yuqoridagi `;` SHART: usiz brauzer ikkala IIFE ni bitta
         ifoda deb o'qiydi va "not a function" xatosi chiqadi. */
      (function () {
        try {
          if (location.pathname !== "/") return
          // Native ilovada yo'nalish hash ichida (`#/kirish`) — u yerda
          // bosh sahifa ma'lumoti kerak emas
          var h = location.hash
          if (h && h !== "#" && h !== "#/") return
          var TILLAR = ["uz", "ru", "en", "zh"]
          var til = localStorage.getItem("aa_lang")
          if (TILLAR.indexOf(til) < 0) {
            var b = (navigator.language || "").slice(0, 2).toLowerCase()
            til = b === "ru" ? "ru" : b === "en" ? "en" : b === "zh" ? "zh" : "uz"
            localStorage.setItem("aa_lang", til)
          }
          /*
            Manzil KESHLOVCHI PROKSI orqali (api/pub/[fn].js).

            Ilgari bu yerda to'g'ridan-to'g'ri Supabase manzili turardi.
            Endi so'rov Vercel'ning chekka tugunidan o'tadi va u yerda
            keshlanadi — mehmon Singapurgacha bormaydi. Sabab va
            o'lchovlar proksi faylida.

            `api.ts` ham AYNAN shu manzilni quradi — ikkalasi mos
            kelmasa bu va'da topilmay qolardi va so'rov ikki marta
            ketardi.

            Proksida kalit kerak emas: uni server o'zi qo'yadi.
          */
          var url =
            "/api/pub/public-homepage-sections" +
            (til !== "uz" ? "?lang=" + til : "")
          window.__aaBoot = {}
          window.__aaBoot[url] = fetch(url, {
            headers: { "Content-Type": "application/json" },
          })
            .then(function (r) {
              return r.ok ? r.json().then(function (d) { return { ok: true, data: d } }) : { ok: false }
            })
            .catch(function () {
              return { ok: false }
            })
        } catch (e) {
          /* localStorage yopiq yoki fetch yo'q — oddiy yo'ldan ketaveradi */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
